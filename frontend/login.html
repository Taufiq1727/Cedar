<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ClinAssistAI</title>
    <meta name="description" content="Login or register for ClinAssistAI - AI-powered clinical history taking.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-left">
            <a href="/" class="brand">
                <div class="brand-icon">🏥</div>
                ClinAssistAI
            </a>
            <div class="auth-card">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-form="login" id="tab-login">Login</button>
                    <button class="auth-tab" data-form="register" id="tab-register">Register</button>
                </div>
                <div class="auth-form-container">
                    <!-- Login Form -->
                    <form class="auth-form active" id="form-login" onsubmit="return handleLogin(event)">
                        <h2>Welcome Back</h2>
                        <p class="subtitle">Login to access your dashboard</p>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="login-email" required placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-input" id="login-password" required placeholder="Enter your password">
                        </div>
                        <div id="login-error" class="form-error" style="margin-bottom:var(--space-3)"></div>
                        <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Login</button>

                        <!-- Quick Demo Accounts -->
                        <div style="margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--gray-200)">
                            <div style="font-size:0.75rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;margin-bottom:8px">⚡ Quick 1-Click Demo Logins:</div>
                            <div style="display:grid;grid-template-columns:1fr;gap:6px">
                                <button type="button" class="btn btn-ghost btn-sm" style="text-align:left;justify-content:flex-start;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534"
                                        onclick="fillDemoLogin('nurse.sunita@clinassistai.com', 'Nurse@123')">
                                    👩‍⚕️ <strong>Nurse Sunita Verma</strong> (OPD Triage Station)
                                </button>
                                <button type="button" class="btn btn-ghost btn-sm" style="text-align:left;justify-content:flex-start;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af"
                                        onclick="fillDemoLogin('siddharth.varma@clinassistai.com', 'Doctor@123')">
                                    👨‍⚕️ <strong>Dr. Siddharth Varma</strong> (Cardiologist)
                                </button>
                                <button type="button" class="btn btn-ghost btn-sm" style="text-align:left;justify-content:flex-start;background:#faf5ff;border:1px solid #e9d5ff;color:#6b21a8"
                                        onclick="fillDemoLogin('roshni.sen@clinassistai.com', 'Doctor@123')">
                                    👨‍⚕️ <strong>Dr. Roshni Sen</strong> (Ophthalmology)
                                </button>
                            </div>
                        </div>

                        <div class="auth-footer">
                            Don't have an account? <a href="#" onclick="switchTab('register')">Register here</a>
                        </div>
                    </form>

                    <!-- Register Form -->
                    <form class="auth-form" id="form-register" onsubmit="return handleRegister(event)">
                        <h2>Create Account</h2>
                        <p class="subtitle">Choose your role to get started</p>

                        <div class="role-selector">
                            <button type="button" class="role-btn active" data-role="assistant" onclick="selectRole('assistant')">👩‍⚕️ Nurse / Assistant</button>
                            <button type="button" class="role-btn" data-role="doctor" onclick="selectRole('doctor')">👨‍⚕️ Doctor</button>
                            <button type="button" class="role-btn" data-role="patient" onclick="selectRole('patient')">🧑 Patient</button>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-input" id="reg-name" required placeholder="Enter your full name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="reg-email" required placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-input" id="reg-password" required placeholder="Min 6 characters" minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-input" id="reg-phone" placeholder="Phone number (optional)">
                        </div>

                        <!-- Patient-specific fields -->
                        <div class="patient-fields" id="patient-fields">
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Age</label>
                                    <input type="number" class="form-input" id="reg-age" placeholder="Age" min="1" max="120">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" id="reg-gender">
                                        <option value="">Select</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Doctor/Assistant-specific fields -->
                        <div class="doctor-fields" id="doctor-fields">
                            <div class="form-group">
                                <label class="form-label">Hospital / Clinic</label>
                                <input type="text" class="form-input" id="reg-hospital" placeholder="Hospital name">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Staff / Professional ID</label>
                                    <input type="text" class="form-input" id="reg-prof-id" placeholder="e.g., REG-10928">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Department / Specialization</label>
                                    <input type="text" class="form-input" id="reg-specialization" placeholder="e.g., Triage OPD / Cardiology">
                                </div>
                            </div>
                        </div>

                        <div id="register-error" class="form-error" style="margin-bottom:var(--space-3)"></div>
                        <button type="submit" class="btn btn-primary" style="width:100%" id="register-btn">Create Account</button>
                        <div class="auth-footer">
                            Already have an account? <a href="#" onclick="switchTab('login')">Login here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script>
        let selectedRole = 'assistant';

        // Parse URL params for tab/role
        const params = new URLSearchParams(window.location.search);
        if (params.get('tab') === 'register') switchTab('register');
        if (params.get('role')) selectRole(params.get('role'));

        // Redirect if already logged in
        if (api.isLoggedIn()) {
            redirectByRole(api.getRole());
        }

        function redirectByRole(role) {
            if (role === 'doctor') {
                window.location.href = '/doctor-dashboard.html';
            } else if (role === 'assistant' || role === 'nurse') {
                window.location.href = '/assistant-dashboard.html';
            } else {
                window.location.href = '/patient-dashboard.html';
            }
        }

        function fillDemoLogin(email, password) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;
            document.getElementById('form-login').dispatchEvent(new Event('submit', { cancelable: true }));
        }

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.querySelector(`[data-form="${tab}"]`).classList.add('active');
            document.getElementById(`form-${tab}`).classList.add('active');
        }

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-role="${role}"]`).classList.add('active');
            document.getElementById('patient-fields').classList.toggle('active', role === 'patient');
            document.getElementById('doctor-fields').classList.toggle('active', role === 'doctor' || role === 'assistant');
        }

        // Tab click handlers
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.form));
        });

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const result = await api.login(
                    document.getElementById('login-email').value,
                    document.getElementById('login-password').value
                );
                showToast(`Welcome back, ${result.name}!`, 'success');
                setTimeout(() => {
                    redirectByRole(result.role);
                }, 400);
            } catch (err) {
                errorEl.textContent = err.message;
                btn.disabled = false;
                btn.textContent = 'Login';
            }
            return false;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            const errorEl = document.getElementById('register-error');
            errorEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const data = {
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value,
                name: document.getElementById('reg-name').value,
                role: selectedRole,
                phone: document.getElementById('reg-phone').value || null,
            };

            if (selectedRole === 'patient') {
                data.age = parseInt(document.getElementById('reg-age').value) || null;
                data.gender = document.getElementById('reg-gender').value || null;
            } else {
                data.hospital = document.getElementById('reg-hospital').value || null;
                data.professional_id = document.getElementById('reg-prof-id').value || null;
                data.specialization = document.getElementById('reg-specialization').value || null;
            }

            try {
                const result = await api.register(data);
                showToast(`Account created! Welcome, ${result.name}!`, 'success');
                setTimeout(() => {
                    redirectByRole(result.role);
                }, 400);
            } catch (err) {
                errorEl.textContent = err.message;
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
            return false;
        }
    </script>
</body>
</html>
